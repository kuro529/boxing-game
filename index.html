<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOXING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#12161f;color:#fff;font-family:system-ui,-apple-system,sans-serif;
-webkit-user-select:none;user-select:none;touch-action:manipulation;
display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{padding:10px 12px 6px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.lbl{font-size:11px;width:34px;opacity:.75}
.bar{flex:1;height:14px;background:#000;border:2px solid #ffffff33;border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;width:100%;transition:width .15s}
#phpF{background:linear-gradient(#6cf,#1878d4)}
#chpF{background:linear-gradient(#ff9a7a,#d32020)}
#stF{background:linear-gradient(#ffe066,#e8a100)}
#stBar{height:8px;border-width:1px}
#info{text-align:center;font-size:13px;letter-spacing:2px;opacity:.9}
#ring{flex:1 1 auto;min-height:0;max-height:250px;position:relative;
display:flex;justify-content:space-between;
align-items:flex-end;padding:0 4px 26px;
background:radial-gradient(60% 70% at 50% 40%,#2b3446,#141a26 70%)}
#ring::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;
background:#3a2a22;border-top:3px solid #6b4a37}
.side{position:relative}
.side.cpu{transform:scaleX(-1)}
.boxer{position:relative;width:118px;height:196px}
.head{position:absolute;left:24px;top:2px;width:54px;height:54px;border-radius:50%;
background:#e6b287;border:3px solid #00000033;transition:transform .12s;z-index:2}
.head::before{content:"";position:absolute;left:30px;top:20px;width:8px;height:8px;
border-radius:50%;background:#333}
.hair{position:absolute;left:22px;top:0;width:58px;height:22px;border-radius:26px 26px 0 0;
background:#2a2a2a;z-index:3}
.torso{position:absolute;left:12px;top:50px;width:80px;height:100px;
border-radius:26px 26px 12px 12px;background:#1e72c8;border:3px solid #00000033}
.cpu .torso{background:#c62828}
.legs{position:absolute;left:22px;top:144px;width:60px;height:48px;
border-radius:10px;background:#2b3345}
.glove{position:absolute;width:38px;height:38px;border-radius:50%;
background:#e23b3b;border:3px solid #00000044;z-index:4;transition:transform .09s ease-out}
.cpu .glove{background:#3b6ee2}
.gl{left:58px;top:60px}
.gr{left:66px;top:104px}
.boxer.pl .gl{transform:translate(52px,-6px) scale(1.15)}
.boxer.pr .gr{transform:translate(64px,-34px) scale(1.25)}
.boxer.gd .gl{transform:translate(-8px,-44px)}
.boxer.gd .gr{transform:translate(-16px,-58px)}
.boxer.sc{animation:chg .12s linear infinite}
@keyframes chg{50%{transform:translateX(-3px)}}
.boxer.sc .gr{transform:translate(-34px,-14px) scale(1.15);box-shadow:0 0 16px 6px #ffd24a}
.boxer.sp .gr{transform:translate(74px,-42px) scale(1.5);box-shadow:0 0 16px 6px #ffd24a}
.boxer.hit{animation:sh .25s}
.boxer.hit .head{transform:translateX(-10px) rotate(-14deg)}
@keyframes sh{0%{transform:translateX(0)}30%{transform:translateX(-10px)}
60%{transform:translateX(5px)}100%{transform:translateX(0)}}
.dzm{position:absolute;left:36px;top:-26px;width:30px;height:30px;opacity:0;z-index:6}
.boxer.dz .dzm{opacity:1;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dzm b{position:absolute;top:9px;font-size:15px;color:#ffd24a;line-height:1}
.dzm b:nth-child(1){left:-2px}
.dzm b:nth-child(2){right:-2px}
.boxer.dz .head{transform:rotate(-8deg)}
.boxer.dz{opacity:.85}
.boxer.ko{transform:rotate(-10deg) translateY(16px);transition:transform .4s}
.boxer.ko .head{transform:translate(-18px,-74px) rotate(32deg);
transition:transform .45s cubic-bezier(.3,-0.4,.5,1.4)}
.boxer.ko .hair{opacity:0}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:30px;
font-weight:800;letter-spacing:3px;text-shadow:0 3px 0 #000;pointer-events:none;opacity:0;
transition:opacity .15s}
#msg.on{opacity:1}
#ctrl{display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.btn{flex:1;min-height:64px;padding:12px 0;font-size:17px;font-weight:700;color:#fff;border:none;
border-radius:14px;background:#38445c;box-shadow:0 4px 0 #1d2534;transition:opacity .2s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d2534}
.btn small{display:block;font-size:10px;font-weight:600;margin-top:3px;opacity:.9}
#bP{background:#d04a2b;box-shadow:0 4px 0 #7a2716}
#bS{background:#e0a81c;box-shadow:0 4px 0 #7a5a0c;color:#221a00}
#bS.off{opacity:.3}
#bS.ready{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.35)}}
#over{position:absolute;inset:0;background:#000000cc;display:flex;
flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9}
#over h1{margin:0;font-size:30px;letter-spacing:4px}
#over p{margin:0;font-size:13px;opacity:.8;text-align:center;line-height:1.7}
#start{padding:16px 40px;font-size:18px;font-weight:700;border:none;border-radius:999px;
background:#ffd24a;color:#222}
</style>
</head>
<body>
<header>
  <div class="row"><span class="lbl">YOU</span>
    <div class="bar"><i id="phpF"></i></div></div>
  <div class="row"><span class="lbl"></span>
    <div class="bar" id="stBar"><i id="stF"></i></div></div>
  <div class="row"><span class="lbl">CPU</span>
    <div class="bar"><i id="chpF"></i></div></div>
  <div id="info">ROUND 1　　1:30</div>
</header>

<div id="ring">
  <div class="side"><div class="boxer idle" id="pB">
    <div class="dzm"><b>✦</b><b>✦</b></div>
    <div class="hair"></div><div class="head"></div>
    <div class="torso"></div><div class="legs"></div>
    <div class="glove gl"></div><div class="glove gr"></div>
  </div></div>
  <div class="side cpu"><div class="boxer idle" id="cB">
    <div class="dzm"><b>✦</b><b>✦</b></div>
    <div class="hair"></div><div class="head"></div>
    <div class="torso"></div><div class="legs"></div>
    <div class="glove gl"></div><div class="glove gr"></div>
  </div></div>
  <div id="msg"></div>
  <div id="over">
    <h1>BOXING</h1>
    <p>パンチ2 / カウンター6+めまい<br>ガードされると1秒めまい<br>渾身15(命中10回かガード2回で解放)<br>3ラウンド各90秒</p>
    <button id="start">試合開始</button>
  </div>
</div>

<div id="ctrl">
  <button class="btn" id="bG">ガード</button>
  <button class="btn off" id="bS">渾身<small id="sInfo">命中0/10 防御0/2</small></button>
  <button class="btn" id="bP">パンチ</button>
</div>

<script>
const $=i=>document.getElementById(i);
const DMG=2,COUNTER=6,SMASH=15,DIZZY=1000,ROUND_TIME=90;
const NEED_HIT=10,NEED_GUARD=2;
function fighter(node){return{hp:100,st:'idle',until:0,cd:0,next:0,stam:100,
  hits:0,guards:0,used:false,alt:false,node:node};}
const P=fighter($('pB'));
const C=fighter($('cB'));
let running=false,round=1,time=ROUND_TIME;

function draw(f){f.node.className='boxer '+f.st;}
function bars(){
  $('phpF').style.width=P.hp+'%';
  $('chpF').style.width=C.hp+'%';
  $('stF').style.width=P.stam+'%';
}
function info(){
  const s=Math.max(0,Math.ceil(time));
  $('info').textContent='ROUND '+round+'　　'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
let msgT;
function msg(t,ms){
  $('msg').textContent=t;$('msg').classList.add('on');
  clearTimeout(msgT);msgT=setTimeout(()=>$('msg').classList.remove('on'),ms||700);
}
function canSmash(f){return !f.used&&(f.hits>=NEED_HIT||f.guards>=NEED_GUARD);}
function updBtn(){
  const ok=canSmash(P);
  $('bS').classList.toggle('off',!ok);
  $('bS').classList.toggle('ready',ok);
  $('sInfo').textContent=P.used?'使用済み':ok?'OK!':
    '命中'+Math.min(P.hits,NEED_HIT)+'/'+NEED_HIT+' 防御'+Math.min(P.guards,NEED_GUARD)+'/'+NEED_GUARD;
}
function ready(f){return running&&f.st==='idle'&&performance.now()>=f.cd;}

function dizzy(f){
  const now=performance.now();
  f.st='dz';f.until=now+DIZZY;draw(f);
  f.cd=f.until;f.next=f.until+200;
}

function hit(t,src,kind){
  if(!running||t.st==='ko')return;
  const now=performance.now();
  if(t.st==='gd'){
    t.guards++;
    msg(src===P?'ガードされた!':'ガード成功!',600);
    dizzy(src);
    updBtn();
    return;
  }
  const counter=['pl','pr','sc','sp'].includes(t.st);
  let d;
  if(kind==='s'){
    d=SMASH;
    msg(src===P?'渾身ヒット!':'渾身被弾!',800);
  }else{
    src.hits++;
    d=counter?COUNTER:DMG;
    if(counter)msg(src===P?'カウンター!':'カウンター被弾!',700);
  }
  t.hp=Math.max(0,t.hp-d);
  if(counter){
    dizzy(t);
  }else if(t.st!=='dz'){
    t.st='hit';t.until=now+(kind==='s'?420:170);draw(t);
  }
  bars();updBtn();
  if(t.hp<=0)ko(t);
}
function ko(t){
  running=false;
  t.st='ko';draw(t);
  setTimeout(()=>finish(t===C?'K.O. 勝利!':'K.O. 負け...'),500);
}
function finish(text){
  $('over').style.display='flex';
  $('over').innerHTML='<h1>'+text+'</h1><button id="start">もう一度</button>';
  $('start').onclick=()=>location.reload();
}

function punch(){
  if(!ready(P))return;
  const now=performance.now();
  P.alt=!P.alt;
  const type=P.alt?'pl':'pr';
  P.st=type;P.until=now+300;draw(P);
  P.cd=P.until+60;
  if(C.st==='idle'&&Math.random()<(C.hp<40?0.36:0.24)){
    C.st='gd';C.until=now+320;draw(C);C.next=C.until+150;
  }
  setTimeout(()=>{if(P.st===type)hit(C,P,'n');},130);
}
function smash(){
  if(!ready(P)||!canSmash(P))return;
  const now=performance.now();
  P.used=true;updBtn();
  P.st='sc';P.until=now+1000;draw(P);
  P.cd=now+260+380+100;
  if(C.st==='idle'&&Math.random()<0.4){
    C.st='gd';C.until=now+520;draw(C);C.next=C.until+150;
  }
  setTimeout(()=>{
    if(P.st!=='sc')return;
    P.st='sp';P.until=performance.now()+380;draw(P);
    setTimeout(()=>{if(P.st==='sp')hit(C,P,'s');},120);
  },260);
}
function guard(){
  if(!ready(P)||P.stam<25)return;
  const now=performance.now();
  P.stam-=30;P.st='gd';P.until=now+600;P.cd=P.until+90;draw(P);bars();
}

function cpuSmash(now,ag){
  C.used=true;
  C.st='sc';C.until=now+1200;draw(C);
  const charge=480-100*ag;
  setTimeout(()=>{
    if(C.st!=='sc')return;
    C.st='sp';C.until=performance.now()+420;draw(C);
    setTimeout(()=>{if(C.st==='sp')hit(P,C,'s');},120);
  },charge);
  C.next=now+charge+420+500;
}
function ai(now){
  if(C.st!=='idle'||now<C.next)return;
  const ag=C.hp<40?1:0;
  if(canSmash(C)&&(P.st==='dz'||Math.random()<0.3)){cpuSmash(now,ag);return;}
  const r=Math.random();
  if(P.st==='dz'||r<0.62+0.12*ag){
    const type=Math.random()<0.5?'pl':'pr';
    const wind=250-50*ag;
    C.st=type;C.until=now+460;draw(C);
    setTimeout(()=>{if(C.st===type)hit(P,C,'n');},wind);
    C.next=now+460+(P.st==='dz'?80:300+Math.random()*350-ag*160);
  }else if(r<0.82){
    C.st='gd';C.until=now+450;draw(C);C.next=C.until+200;
  }else{
    C.next=now+300+Math.random()*450;
  }
}

function endRound(){
  running=false;
  if(round>=3){
    setTimeout(()=>finish(P.hp>C.hp?'判定勝ち!':P.hp<C.hp?'判定負け...':'ドロー'),300);
    return;
  }
  msg('ROUND '+round+' 終了',1200);
  setTimeout(()=>{
    round++;time=ROUND_TIME;
    [P,C].forEach(f=>{
      f.hp=Math.min(100,f.hp+10);
      f.hits=0;f.guards=0;f.used=false;
      f.st='idle';f.cd=0;f.next=0;draw(f);
    });
    P.stam=100;
    bars();info();updBtn();msg('ROUND '+round,900);
    running=true;
  },1500);
}

setInterval(()=>{
  const now=performance.now();
  [P,C].forEach(f=>{
    if(f.st!=='idle'&&f.st!=='ko'&&now>f.until){f.st='idle';draw(f);}
  });
  if(P.st!=='gd'&&P.stam<100){P.stam=Math.min(100,P.stam+1.2);bars();}
  if(running){
    ai(now);
    time-=0.04;info();
    if(time<=0)endRound();
  }
},40);

$('bG').addEventListener('pointerdown',e=>{e.preventDefault();guard()});
$('bS').addEventListener('pointerdown',e=>{e.preventDefault();smash()});
$('bP').addEventListener('pointerdown',e=>{e.preventDefault();punch()});
$('start').onclick=()=>{
  $('over').style.display='none';running=true;msg('FIGHT!',800);
};
bars();info();updBtn();
</script>
</body>
</html>
